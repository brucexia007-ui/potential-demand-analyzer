name: Bug 报告
description: 提交可稳定复现的产品或工程问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请按 SECURITY.md 私下报告，不要填写此表单。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现重复问题
          required: true
        - label: 报告中不包含 API Key、Cookie、客户私有数据或个人信息
          required: true
        - label: 这不是需要私下披露的安全漏洞
          required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: Git commit、Git tag 或镜像 digest
      placeholder: 例如 v0.1.0 或 abcdef12
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 运行方式
      options:
        - Docker 本地源码栈
        - Docker 生产栈
        - 本地非 Docker 开发
        - GitHub Actions
        - 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Docker/Node/Python 版本、浏览器和必要的非敏感配置
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 请给出从干净状态开始可重复执行的步骤
      placeholder: |
        1. 启动……
        2. 打开……
        3. 点击……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志或截图
      description: 请删除密钥、令牌、客户名称、个人信息和内部地址
      render: shell
  - type: textarea
    id: edge_cases
    attributes:
      label: 已验证的边缘情况
      description: 例如重试、刷新、暂停/继续、空证据、网络阻断或不同研究深度
