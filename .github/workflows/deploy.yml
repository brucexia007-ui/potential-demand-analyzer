name: Deploy

# 推送 tag v* 时构建 Docker 镜像并推送到 GitHub Container Registry
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: analyzer_test
          POSTGRES_USER: analyzer
          POSTGRES_PASSWORD: analyzer_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL_TEST: postgresql://analyzer:analyzer_pwd@localhost:5432/analyzer_test
      REDIS_URL: redis://localhost:6379/0
      ENV: test
      SECRET_KEY: ci-only-secret-key-not-for-production-0001
      CONFIG_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 验证后端
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.txt --progress-spinner off
          python -m pytest --tb=short -q

      - name: 验证前端
        run: |
          cd frontend
          npm ci
          node --test tests/security-dependencies.test.mjs
          npm run build

  build-and-push:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/backend
            ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: 构建并推送 Backend 镜像
        id: backend_image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并推送 Frontend 镜像
        id: frontend_image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 记录可部署镜像摘要
        run: |
          echo "Backend: ghcr.io/${{ github.repository }}/backend@${{ steps.backend_image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Frontend: ghcr.io/${{ github.repository }}/frontend@${{ steps.frontend_image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
