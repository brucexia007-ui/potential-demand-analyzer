  - id: incumbent-no-replacement
    scenario: 现有供应商合同仍有效，且没有替换、扩容或提前终止证据。
    skills: [pilot-opportunity, researching-bidding-history, matching-product-capabilities]
    gate:
      entity_confirmed: true
      has_time_evidence: true
      has_capability_baseline: true
      has_material_gap: true
      has_current_trigger: true
      has_current_window: false
      fit_verified: true
