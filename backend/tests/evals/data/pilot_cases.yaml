  - id: g4-potential-window
    scenario: 客户需求、触发和采购窗口有直接证据，但产品适配仍缺必需参数。
    skills: [pilot-opportunity, matching-product-capabilities]
    gate:
      entity_confirmed: true
      has_time_evidence: true
      has_capability_baseline: true
      has_material_gap: true
      has_current_trigger: true
      has_current_window: true
      fit_verified: false
      hard_fit_blocker: false
      unresolved_skeptic_blocker: false
      direct_claim_support_count: 2
    ranking_factors:
      - {dimension: need, value: 0.9, dedupe_key: claim-need}
      - {dimension: window, value: 0.8, dedupe_key: claim-window}
    expected:
      gate_grade: G4
      decision: POTENTIAL_WINDOW
      can_create_opportunity_hypothesis: true
      deduped_factor_count: 2

  - id: g5-candidate
    scenario: 主体、时间、能力基线、缺口、当前触发、采购窗口和产品适配均有直接证据。
    skills: [pilot-opportunity, matching-product-capabilities]
    gate:
      entity_confirmed: true
      has_time_evidence: true
      has_capability_baseline: true
      has_material_gap: true
      has_current_trigger: true
      has_current_window: true
      fit_verified: true
      hard_fit_blocker: false
      unresolved_skeptic_blocker: false
      direct_claim_support_count: 2
    ranking_factors:
      - {dimension: need, value: 0.9, dedupe_key: claim-need}
      - {dimension: window, value: 0.9, dedupe_key: claim-window}
      - {dimension: fit, value: 0.8, dedupe_key: claim-fit}
    expected:
      gate_grade: G5
      decision: CANDIDATE
      can_create_opportunity_hypothesis: true
      deduped_factor_count: 3

  - id: duplicate-factor-does-not-inflate
    scenario: 同一 Claim 被多个分析维度重复引用，不得重复抬升排序分或 Gate 等级。
    skills: [pilot-opportunity, mining-customer-pain-points, matching-product-capabilities]
    gate:
      entity_confirmed: true
      has_time_evidence: true
      has_capability_baseline: true
      has_material_gap: true
      has_current_trigger: true
      has_current_window: true
      fit_verified: false
      hard_fit_blocker: false
      unresolved_skeptic_blocker: false
      direct_claim_support_count: 1
    ranking_factors:
      - {dimension: need, value: 0.7, dedupe_key: same-claim}
      - {dimension: need, value: 0.7, dedupe_key: same-claim}
      - {dimension: confidence, value: 0.8, dedupe_key: independent-confidence}
    expected:
      gate_grade: G4
      decision: POTENTIAL_WINDOW
      can_create_opportunity_hypothesis: true
      deduped_factor_count: 2
